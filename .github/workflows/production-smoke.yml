name: Louisburg Local production smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about.html'
      - 'web-v4/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'googled3854f03f7860ff5.html'
      - 'tests/production-smoke.mjs'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: louisburg-local-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages deployment
        run: sleep 90
      - name: Smoke production custom domain
        id: production_smoke
        continue-on-error: true
        run: node tests/production-smoke.mjs

      - name: Publish smoke commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.production_smoke.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            STATE=success
            DESC="Louisburg Local production smoke passed"
          else
            STATE=failure
            DESC="Louisburg Local production smoke failed"
          fi
          curl --fail-with-body             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA"             -d "{\"state\":\"$STATE\",\"context\":\"production-smoke\",\"description\":\"$DESC\"}"

      - name: Fail workflow when smoke failed
        if: always() && steps.production_smoke.outcome != 'success'
        run: exit 1
